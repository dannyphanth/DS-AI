<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <filter id="gl">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glStrong">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glSoft">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Circuit board traces background -->
  <g stroke="rgba(48,164,199,0.2)" stroke-width="0.8" fill="none">
    <!-- Left side circuits -->
    <path d="M15,70 L8,70 L8,60 L3,60"/>
    <path d="M8,70 L8,80 L3,80"/>
    <circle cx="3" cy="60" r="1.5" fill="rgba(48,164,199,0.25)"/>
    <circle cx="3" cy="80" r="1.5" fill="rgba(48,164,199,0.25)"/>
    <path d="M25,90 L18,90 L18,100 L10,100"/>
    <path d="M18,90 L18,85 L12,85"/>
    <circle cx="10" cy="100" r="1.5" fill="rgba(48,164,199,0.2)"/>
    <circle cx="12" cy="85" r="1.2" fill="rgba(48,164,199,0.2)"/>
    <path d="M30,45 L22,45 L22,35 L15,35"/>
    <path d="M22,45 L22,52 L15,52"/>
    <circle cx="15" cy="35" r="1.5" fill="rgba(48,164,199,0.2)"/>
    <circle cx="15" cy="52" r="1.2" fill="rgba(48,164,199,0.2)"/>

    <!-- Right side circuits -->
    <path d="M125,70 L132,70 L132,60 L137,60"/>
    <path d="M132,70 L132,80 L137,80"/>
    <circle cx="137" cy="60" r="1.5" fill="rgba(48,164,199,0.25)"/>
    <circle cx="137" cy="80" r="1.5" fill="rgba(48,164,199,0.25)"/>
    <path d="M115,90 L122,90 L122,100 L130,100"/>
    <path d="M122,90 L122,85 L128,85"/>
    <circle cx="130" cy="100" r="1.5" fill="rgba(48,164,199,0.2)"/>
    <circle cx="128" cy="85" r="1.2" fill="rgba(48,164,199,0.2)"/>
    <path d="M110,45 L118,45 L118,35 L125,35"/>
    <path d="M118,45 L118,52 L125,52"/>
    <circle cx="125" cy="35" r="1.5" fill="rgba(48,164,199,0.2)"/>
    <circle cx="125" cy="52" r="1.2" fill="rgba(48,164,199,0.2)"/>

    <!-- Top circuits -->
    <path d="M55,22 L55,14 L48,14"/>
    <path d="M65,20 L65,10 L58,10"/>
    <path d="M75,20 L75,10 L82,10"/>
    <path d="M85,22 L85,14 L92,14"/>
    <circle cx="48" cy="14" r="1.2" fill="rgba(48,164,199,0.2)"/>
    <circle cx="58" cy="10" r="1.2" fill="rgba(48,164,199,0.2)"/>
    <circle cx="82" cy="10" r="1.2" fill="rgba(48,164,199,0.2)"/>
    <circle cx="92" cy="14" r="1.2" fill="rgba(48,164,199,0.2)"/>

    <!-- Bottom circuits -->
    <path d="M60,110 L60,118 L52,118"/>
    <path d="M70,112 L70,122 L78,122"/>
    <path d="M80,110 L80,118 L88,118"/>
    <circle cx="52" cy="118" r="1.2" fill="rgba(48,164,199,0.2)"/>
    <circle cx="78" cy="122" r="1.2" fill="rgba(48,164,199,0.2)"/>
    <circle cx="88" cy="118" r="1.2" fill="rgba(48,164,199,0.2)"/>
  </g>

  <!-- Low-poly anatomical heart wireframe -->
  <g filter="url(#gl)" transform="translate(70,62) scale(0.72)">
    <!-- Outer shape triangulated -->
    <g fill="none" stroke="rgba(48,164,199,0.8)" stroke-width="1.4">
      <!-- Left ventricle outer -->
      <polygon points="-40,-10 -50,10 -35,5"/>
      <polygon points="-50,10 -40,30 -35,5"/>
      <polygon points="-40,30 -25,20 -35,5"/>
      <polygon points="-40,30 -20,45 -25,20"/>
      <polygon points="-20,45 -5,55 -25,20"/>
      <polygon points="-5,55 0,65 -20,45"/>

      <!-- Right ventricle outer -->
      <polygon points="40,-10 50,10 35,5"/>
      <polygon points="50,10 40,30 35,5"/>
      <polygon points="40,30 25,20 35,5"/>
      <polygon points="40,30 20,45 25,20"/>
      <polygon points="20,45 5,55 25,20"/>
      <polygon points="5,55 0,65 20,45"/>

      <!-- Center connecting -->
      <polygon points="-35,5 -25,20 -10,10"/>
      <polygon points="35,5 25,20 10,10"/>
      <polygon points="-10,10 0,0 10,10"/>
      <polygon points="-10,10 -25,20 0,25"/>
      <polygon points="10,10 25,20 0,25"/>
      <polygon points="-25,20 0,25 -5,55"/>
      <polygon points="25,20 0,25 5,55"/>
      <polygon points="0,25 -5,55 5,55"/>

      <!-- Top / aorta area -->
      <polygon points="-40,-10 -20,-25 -10,-10"/>
      <polygon points="-40,-10 -35,5 -10,-10"/>
      <polygon points="-10,-10 -10,10 -35,5"/>
      <polygon points="-10,-10 0,0 -10,10"/>
      <polygon points="40,-10 20,-25 10,-10"/>
      <polygon points="40,-10 35,5 10,-10"/>
      <polygon points="10,-10 10,10 35,5"/>
      <polygon points="10,-10 0,0 10,10"/>

      <!-- Aorta / vessels top -->
      <polygon points="-20,-25 -10,-10 0,-18"/>
      <polygon points="20,-25 10,-10 0,-18"/>
      <polygon points="-20,-25 0,-18 -15,-40"/>
      <polygon points="20,-25 0,-18 15,-40"/>
      <polygon points="-15,-40 0,-18 0,-35"/>
      <polygon points="15,-40 0,-18 0,-35"/>

      <!-- Vessel branches -->
      <line x1="-15" y1="-40" x2="-28" y2="-48" stroke-width="1.2"/>
      <line x1="-28" y1="-48" x2="-38" y2="-45" stroke-width="1.2"/>
      <line x1="15" y1="-40" x2="28" y2="-48" stroke-width="1.2"/>
      <line x1="28" y1="-48" x2="38" y2="-45" stroke-width="1.2"/>
    </g>

    <!-- Inner detail lines (fainter) -->
    <g fill="none" stroke="rgba(48,164,199,0.35)" stroke-width="0.7">
      <line x1="-35" y1="5" x2="0" y2="0"/>
      <line x1="35" y1="5" x2="0" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="25"/>
      <line x1="-10" y1="10" x2="10" y2="10"/>
      <line x1="-5" y1="55" x2="5" y2="55"/>
    </g>

    <!-- Glowing vertex nodes -->
    <g fill="rgba(48,164,199,0.9)">
      <circle cx="-40" cy="-10" r="1.8"/>
      <circle cx="40" cy="-10" r="1.8"/>
      <circle cx="-50" cy="10" r="1.5"/>
      <circle cx="50" cy="10" r="1.5"/>
      <circle cx="-35" cy="5" r="1.5"/>
      <circle cx="35" cy="5" r="1.5"/>
      <circle cx="-40" cy="30" r="1.5"/>
      <circle cx="40" cy="30" r="1.5"/>
      <circle cx="-25" cy="20" r="1.5"/>
      <circle cx="25" cy="20" r="1.5"/>
      <circle cx="-20" cy="45" r="1.5"/>
      <circle cx="20" cy="45" r="1.5"/>
      <circle cx="-5" cy="55" r="1.5"/>
      <circle cx="5" cy="55" r="1.5"/>
      <circle cx="0" cy="65" r="2"/>
      <circle cx="-10" cy="10" r="1.5"/>
      <circle cx="10" cy="10" r="1.5"/>
      <circle cx="-10" cy="-10" r="1.5"/>
      <circle cx="10" cy="-10" r="1.5"/>
      <circle cx="0" cy="0" r="2"/>
      <circle cx="0" cy="25" r="1.5"/>
      <circle cx="-20" cy="-25" r="1.5"/>
      <circle cx="20" cy="-25" r="1.5"/>
      <circle cx="0" cy="-18" r="1.5"/>
      <circle cx="-15" cy="-40" r="1.5"/>
      <circle cx="15" cy="-40" r="1.5"/>
      <circle cx="0" cy="-35" r="1.5"/>
      <circle cx="-28" cy="-48" r="1.3"/>
      <circle cx="28" cy="-48" r="1.3"/>
      <circle cx="-38" cy="-45" r="1.3"/>
      <circle cx="38" cy="-45" r="1.3"/>
    </g>
  </g>

  <!-- EKG heartbeat line across middle -->
  <polyline filter="url(#glStrong)"
    points="2,72 20,72 30,72 38,70 44,74 50,58 58,85 65,52 72,80 78,68 84,72 100,72 138,72"
    fill="none" stroke="rgba(48,164,199,1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
